# The macOS computer helper ("Use my apps"): one Swift file, built here as a
# universal binary (arm64 + x86_64, joined with lipo, signed ad hoc after the
# join) and uploaded as the `buddi-computer` artifact. The release's Linux
# publish job downloads it into packages/tools/browser/dist/native before
# packing; ci runs it on every push so a Swift change that stops compiling is
# caught before a tag. No pnpm install: the build script needs Node and the
# Xcode command line tools only.
name: native
on:
  workflow_call:
  workflow_dispatch:
jobs:
  helper:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node packages/tools/browser/scripts/build-native.mjs --universal
      - name: Universal, signed, and answering
        run: |
          f=packages/tools/browser/dist/native/buddi-computer
          archs=$(lipo -archs "$f"); echo "archs: $archs"
          case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "::error::not universal: $archs"; exit 1;; esac
          codesign --verify --verbose "$f"
          echo '{"operation":"version"}' | "$f" | tee /dev/stderr | grep -q '"version"'
      - uses: actions/upload-artifact@v4
        with:
          name: buddi-computer
          path: packages/tools/browser/dist/native/buddi-computer
          if-no-files-found: error
          retention-days: 7
