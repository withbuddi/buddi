# Windows: the gate's suites on windows-latest, to keep buddi building and
# passing there while Windows is a test platform (not public yet). Runs on the
# `windows` branch, on demand, and nightly.
#
# The runner has no Docker for service containers, so the database suites run
# against the PostgreSQL the image ships (stopped by default; user postgres,
# password root, binaries under $PGBIN). Every suite step runs even when an
# earlier one failed, so one run lists every failure.
#
# Run on demand with `installer` on, it builds the Windows setup from the
# branch instead (`gh workflow run windows.yml --ref <branch> -f installer=true`):
# two versions packed from this checkout (`version`, and one pre-release above
# it), each bundled (scripts/release/windows-bundle.sh, around the local
# tarball) and wrapped with the desktop app (scripts/release/windows-desktop.sh,
# its Rust tests and clippy first; apps/windows/buddi.iss), smoke-installed, the second
# run over the first (the switch of `current`) and uninstalled
# (scripts/release/windows-smoke.sh: buddi is not started, Postgres refuses the
# runner's administrator account), and uploaded as the run's artifact, for a VM
# before any tag. The backup, stop, rollback and npm takeover are
# windows-setup.test.ts's, and a VM pass's (docs/install.md §1.3).
name: windows
on:
  push:
    branches: [windows]
    paths-ignore: ['docs/**', '**/*.md', 'feedback/**']
  workflow_dispatch:
    inputs:
      installer:
        description: 'Build and smoke the Windows setup from this branch instead of running the suites'
        type: boolean
        default: false
      version:
        description: 'The version the first setup is built as (0.1.0-pre.N); the second is pre.N+1'
        default: '0.1.0-pre.900'
  schedule:
    - cron: '43 4 * * *'   # nightly, 04:43 UTC
jobs:
  suites:
    if: ${{ !inputs.installer }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: postgres://postgres:root@127.0.0.1:5432/buddi
      BUDDI_VAULT: memory
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Start the runner's PostgreSQL
        shell: pwsh
        run: |
          $svc = Get-Service -Name postgresql*
          Set-Service -InputObject $svc -Status running -StartupType automatic
          & "$env:PGBIN\pg_isready.exe" -h 127.0.0.1 -t 60
          & "$env:PGBIN\createdb.exe" -h 127.0.0.1 -U postgres buddi
      # The runner's own temp folder is an 8.3 path (RUNNER~1), which Vite's
      # loader percent-encodes and then cannot find; RUNNER_TEMP has no tilde.
      - run: printf 'TEMP=%s\nTMP=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-boundaries.mjs
      - run: pnpm -r build
      - id: typecheck
        if: ${{ !cancelled() }}
        run: pnpm -r --no-bail typecheck
      - id: migrate
        if: ${{ !cancelled() }}
        run: node scripts/migrate.mjs
      - name: core
        if: ${{ !cancelled() }}
        run: pnpm --filter @buddi/core test
      - name: runtime
        if: ${{ !cancelled() }}
        run: pnpm --filter @buddi/runtime test
      - name: tools
        if: ${{ !cancelled() }}
        run: pnpm -r --no-bail --filter './packages/tools/*' test
      - name: cli
        if: ${{ !cancelled() }}
        run: pnpm --filter @buddi/cli test
      - name: install
        if: ${{ !cancelled() }}
        run: pnpm --filter @buddi/install test
      - name: extension
        if: ${{ !cancelled() }}
        run: pnpm --filter @buddi/extension test
      - name: examples
        if: ${{ !cancelled() }}
        run: pnpm -r --no-bail --filter './examples/plugins/*' test
      - name: gateway
        if: ${{ !cancelled() }}
        run: pnpm --filter @buddi/gateway test
      - name: generic install
        if: ${{ !cancelled() }}
        run: pnpm check:generic
      - name: scripts
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run --dir scripts

  # The desktop app's Rust on Windows (apps/desktop): the Windows rules'
  # tests and clippy with warnings as errors.
  desktop:
    if: ${{ !inputs.installer }}
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup component add clippy && rustc --version
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  # The jsdom suite: platform-light, but slow; its own job so it never holds up
  # the list above.
  web:
    if: ${{ !inputs.installer }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: postgres://x@127.0.0.1:1/x
      BUDDI_VAULT: memory
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@buddi/web^...' build
      - run: pnpm --filter @buddi/web build
      - run: pnpm --filter @buddi/web exec vitest run

  # The Windows setup, built from the branch (see the top). The tarballs are
  # packed on Linux, as the release packs them (build.mjs runs npm without a shell).
  pack:
    if: ${{ inputs.installer }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      V1: ${{ inputs.version }}
      BUDDI_RELEASE_NOTES_OPTIONAL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Two versions
        run: |
          echo "$V1" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-pre\.[0-9]+$' || { echo "::error::\"$V1\" is not a version like 0.1.0-pre.900"; exit 1; }
          V2="${V1%.*}.$(( ${V1##*.} + 1 ))"
          mkdir -p build/pack
          for v in "$V1" "$V2"; do
            out=$(BUDDI_RELEASE_VERSION="$v" pnpm -s release:pack | tail -1)
            cp "${out##*Release: }" "build/pack/buddi-$v.tgz"
          done
          ls -l build/pack
      - uses: actions/upload-artifact@v4
        with:
          name: buddi-tarballs
          path: build/pack/*.tgz
          retention-days: 7

  installer:
    needs: [pack]
    if: ${{ inputs.installer }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      V1: ${{ inputs.version }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with:
          name: buddi-tarballs
          path: build/pack
      - name: Inno Setup and the Visual C++ runtime
        run: scripts/release/windows-tools.sh
      - name: The desktop app's tests and clippy
        working-directory: apps/desktop
        run: |
          rustup toolchain install && rustup component add clippy
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: The desktop app and the WebView2 bootstrapper
        run: scripts/release/windows-desktop.sh "$V1" build/windows
      - name: Two versions, bundled and wrapped
        run: |
          V2="${V1%.*}.$(( ${V1##*.} + 1 ))"
          echo "V2=$V2" >> "$GITHUB_ENV"
          for v in "$V1" "$V2"; do
            BUDDI_TGZ="build/pack/buddi-$v.tgz" scripts/release/windows-bundle.sh "$v" build/windows
            scripts/release/windows-setup.sh "$v" "build/windows/buddi-$v-windows-x64.zip" build/windows
          done
          ls -l build/windows
      - name: Install, start, check, upgrade, uninstall
        run: scripts/release/windows-smoke.sh "build/windows/buddi-$V1-windows-x64-setup.exe" "build/windows/buddi-$V2-windows-x64-setup.exe"
      - name: Logs
        if: ${{ failure() }}
        run: |
          cat "$RUNNER_TEMP"/windows-smoke/*.log 2>/dev/null || true
          tail -n 200 "$LOCALAPPDATA"/buddi/logs/*.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: buddi-windows-setup
          path: |
            build/windows/*-setup.exe
            build/windows/MicrosoftEdgeWebview2Setup.exe.sha256
            build/windows/*.zip
            build/windows/*.sha256
          retention-days: 7
