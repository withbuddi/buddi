# Release flow v2 (docs/release.md). `pnpm release pre.N` pushes a release
# commit to main ("Release <version>" with release/REQUEST.json); nobody pushes
# a tag by hand. Two runs of this workflow make a release:
#
#  1. The push to main: `plan` (scripts/release/plan.mjs) asks whether HEAD is,
#     or sits up to 50 commits on top of, a release commit whose tag does not
#     exist yet. If not, the run ends with a notice (ci.yml gates ordinary
#     pushes). If so: the full gate, then `tag` tags HEAD `v<version>` and
#     starts run 2. A red gate tags nothing: fix it on main, and the next green
#     push tags the release with the fix in it (or re-run the failed jobs).
#  2. workflow_dispatch on the tag (`publish: true`, started by `tag`): publish,
#     mac-check, mac-app. It has to run on the tag ref, not main: npm's
#     provenance names the ref the workflow ran for, and installers and
#     buddi.app accept only `release.yml@refs/tags/v<version>`
#     (packages/install/src/provenance.ts). A tag pushed with the workflow's
#     own token starts no workflow, but a dispatch does.
#
# The publish run builds the one tarball the trial and the
# packaged install use (`pnpm release:pack`) and publishes it to npmjs.com
# with provenance, through npm's trusted publishing (OIDC: no token lives in
# this repository). A pre-release version (`v0.1.0-pre.14`) goes under the
# `next` dist-tag once a stable version exists (until then it is `latest`), so after 0.1.0 `npm install @withbuddi/buddi` never resolves to one; a plain
# version (`v0.1.0`) goes under `latest`. The GitHub release is created in
# the same run, marked latest until a stable version exists, with the
# tarball, the Chrome Web Store zip of the extension and the Linux install
# script attached (the linux, desktop and windows jobs add their builds). Computer control (the macOS helper) is not in it: it is
# the Computer plugin, built and published from withbuddi/buddi-plugins.
#
# Once, on npmjs.com: package `@withbuddi/buddi` → Settings → Publishing access →
# add a trusted publisher: GitHub, owner `withbuddi`, repository `buddi`,
# workflow `release.yml`, environment `npm`.
#
# After the npm publish, `mac-app` builds buddi.app around that same tarball,
# signs and notarizes it, and publishes the DMG and its Sparkle feed (see the
# job). The npm release is out by then, so the job can be run again on its own:
# Actions → release → Run workflow on the tag `v<version>`, with the version
# (`0.1.0-pre.39`) and `publish` left off (the Mac and Linux jobs refuse any
# other ref, so what they attach is the tag's code).
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'A buddi version (0.1.0-pre.39). Without publish: build buddi.app for a version already on npm (only the Mac app jobs).'
        required: true
      publish:
        description: 'Publish the version (npm, GitHub release, buddi.app). Run from its tag v<version>; the tag job starts this itself.'
        type: boolean
        default: false
# Pushes to main queue (a newer push replaces one still waiting), so two runs
# never race to tag; a publish run has its own lane per version.
concurrency:
  group: ${{ github.event_name == 'push' && 'release-main' || format('release-{0}-{1}', inputs.version, inputs.publish) }}
  cancel-in-progress: false
jobs:
  # What this run is: a push that tags a release (`action: tag`) or not, a
  # publish run on a tag (`mode: publish`), or a Mac-app-only run (`mode: mac`).
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      action: ${{ steps.push.outputs.action }}
      version: ${{ steps.push.outputs.version || steps.dispatch.outputs.version }}
      tag: ${{ steps.push.outputs.tag }}
      sha: ${{ steps.push.outputs.sha }}
      mode: ${{ steps.dispatch.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: A release to tag?
        id: push
        if: github.event_name == 'push'
        run: node scripts/release/plan.mjs --github
      - name: Publish or Mac app
        id: dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          ASKED: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          v="${ASKED#v}"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-pre\.[0-9]+)?$' || { echo "::error::\"$v\" is not a buddi version like 0.1.0-pre.39"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" = "true" ]; then
            [ "$GITHUB_REF" = "refs/tags/v$v" ] || { echo "::error::Publishing $v runs on its tag v$v, not $GITHUB_REF (npm provenance names the ref)."; exit 1; }
            node scripts/release/plan.mjs --github --verify "$v"
            echo "mode=publish" >> "$GITHUB_OUTPUT"
          else
            echo "mode=mac" >> "$GITHUB_OUTPUT"
          fi

  # The full gate first: only what passed everything is tagged.
  gate:
    needs: [plan]
    if: needs.plan.outputs.action == 'tag'
    uses: ./.github/workflows/gate.yml

  # buddi.app runs every later buddi on the Node it shipped with
  # (apps/mac/NODE_VERSION): a release whose engines.node excludes it, or an
  # app recipe without npm beside node, is not tagged (docs/release.md).
  runtime:
    needs: [plan]
    if: needs.plan.outputs.action == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ needs.plan.outputs.sha }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: buddi runs on the Node buddi.app ships
        run: node scripts/release/runtime-gate.mjs

  tag:
    needs: [plan, gate, runtime]
    if: needs.plan.outputs.action == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # push the tag
      actions: write    # start the publish run
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ needs.plan.outputs.sha }}' }
      - name: Tag the gated commit
        run: |
          # The commit the tag names on origin, peeled when it is annotated;
          # empty when there is no such tag yet.
          named=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" \
            | awk '{ sha[$2] = $1 } END { t = ENVIRON["TAG"]; p = sha["refs/tags/" t "^{}"]; print (p != "" ? p : sha["refs/tags/" t]) }')
          if [ -n "$named" ] && [ "$named" != "$SHA" ]; then
            echo "::error::$TAG appeared on origin naming ${named:0:8}, not ${SHA:0:8}; not moving it."
            exit 1
          fi
          if [ "$named" = "$SHA" ]; then
            # A re-run after the dispatch below failed: the tag is already
            # this commit's, so go on to the dispatch.
            echo "::notice title=$TAG already tagged::$TAG already names ${SHA:0:8}; starting the publish run again."
          else
            git tag "$TAG" "$SHA"
            git push origin "refs/tags/$TAG"
            echo "::notice title=Tagged $TAG::${SHA:0:8} passed the gate and is $TAG."
          fi
      - name: Start the publish run on the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml --ref "$TAG" -f version="$VERSION" -f publish=true
          echo "Publish run started on $TAG: gh run list --workflow release --limit 3"

  publish:
    needs: [plan]
    if: needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    outputs:
      # The dist-tag this run published under; mac-app trusts it over npm's
      # answer, which lags a fresh publish by minutes.
      dist_tag: ${{ steps.v.outputs.tag }}
    permissions:
      contents: write   # the GitHub release
      id-token: write   # npm trusted publishing (provenance)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        # No `registry-url`: it writes an .npmrc with a token placeholder, and
        # npm then sends that instead of the OIDC token. Trusted publishing
        # needs npm 11.5 or later; Node 22 ships an older one.
        with: { node-version: 22, cache: pnpm }
      # npm 11: trusted publishing needs 11.5 or later, and 11 is what the
      # release build's `npm pack --json` was written against.
      - run: npm install -g npm@11 && npm --version
      - run: pnpm install --frozen-lockfile
      # The tarball is built from the workspace's dist output.
      - run: pnpm -r build
      - name: Version from the plan
        id: v
        env:
          PLANNED: ${{ needs.plan.outputs.version }}
        run: |
          v="$PLANNED"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # Until a stable version exists, a pre-release IS the latest buddi:
          # it goes out as `latest`, and its GitHub release is marked latest.
          # Once npm holds any version without a `-`, pre-releases go to `next`.
          #
          # `next` is therefore only meaningful after 0.1.0, and until then it
          # is left alone (stale at whatever it last pointed to) and nothing
          # advertises it. Moving it too is not possible from here: `npm
          # publish` takes one `--tag` (a second one wins, it does not add), and
          # trusted publishing authorises `npm publish` only, never `npm
          # dist-tag add`, which would need a long-lived token in this repo.
          stable=$(npm view @withbuddi/buddi versions --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const v=[].concat(JSON.parse(s||"[]"));console.log(v.some(x=>!x.includes("-"))?"yes":"no")})')
          case "$v" in
            *-*) if [ "$stable" = "yes" ]; then echo "tag=next" >> "$GITHUB_OUTPUT"; echo "pre=--prerelease" >> "$GITHUB_OUTPUT"; else echo "tag=latest" >> "$GITHUB_OUTPUT"; echo "pre=--latest" >> "$GITHUB_OUTPUT"; fi;;
            *) echo "tag=latest" >> "$GITHUB_OUTPUT"; echo "pre=--latest" >> "$GITHUB_OUTPUT";;
          esac
      - name: Build the tarball
        id: pack
        env:
          BUDDI_RELEASE_VERSION: ${{ steps.v.outputs.version }}
        run: |
          out=$(pnpm -s release:pack | tail -1)
          tgz="${out##*Release: }"
          test -f "$tgz" || { echo "release:pack printed no tarball: $out" >&2; exit 1; }
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"
          # The Chrome Web Store zip, written beside the tarball (no `key`: the store assigns the id).
          zip="$(dirname "$tgz")/buddi-extension-${{ steps.v.outputs.version }}.zip"
          test -f "$zip" || { echo "release:pack wrote no extension zip at $zip" >&2; exit 1; }
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
      - name: Publish to npm
        # --provenance: npm attests the build to this public repository and
        # this workflow run, so an installer can verify where the tarball came from.
        run: npm publish "${{ steps.pack.outputs.tgz }}" --provenance --access public --tag "${{ steps.v.outputs.tag }}"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre="${{ steps.v.outputs.pre }}"
          # The version's section of CHANGELOG.md; a missing or empty one fails the release.
          section=$(node scripts/release/changelog.mjs section "${{ steps.v.outputs.version }}")
          notes="$section

          npm: \`npm install -g @withbuddi/buddi@${{ steps.v.outputs.version }}\` (dist-tag ${{ steps.v.outputs.tag }}).
          Linux: \`curl -fsSL https://withbuddi.com/install.sh | BUDDI_VERSION=${{ steps.v.outputs.version }} sh\` (the linux-x64 and linux-arm64 tarballs below, attached by the linux job).
          Linux desktop app: \`buddi-desktop-${{ steps.v.outputs.version }}-linux-<arch>.deb\` (\`sudo apt install ./buddi-desktop-…deb\`) or the AppImage, attached by the desktop job; it opens the buddi installed by the line above.
          Windows (for testing): \`buddi-${{ steps.v.outputs.version }}-windows-x64-setup.exe\`, attached by the windows job; per user, no administrator, x64 and Windows on Arm. Unsigned for now: SmartScreen asks once (More info → Run anyway)."
          gh release create "v${{ steps.v.outputs.version }}" --verify-tag $pre --title "buddi ${{ steps.v.outputs.version }}" \
            --notes "$notes" \
            "${{ steps.pack.outputs.tgz }}" "${{ steps.pack.outputs.zip }}" scripts/install.sh
      - name: Tell withbuddi.com
        # withbuddi.com reads buddi's version from npm at build time
        # (buddi-site's scripts/sync-release.mjs runs in its build), so a rebuild
        # is all a release needs. SITE_DEPLOY_HOOK is the site's Cloudflare
        # deploy hook (the same secret site-docs.yml uses). npm's dist-tag can
        # lag publish by five minutes or more, so wait up to 15 for it before
        # asking for the build. Without the hook, a notice; the site's hourly check catches up.
        if: steps.v.outputs.tag == 'latest'
        env:
          HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::SITE_DEPLOY_HOOK is not set; withbuddi.com picks up $VERSION at its next hourly check."
            exit 0
          fi
          for _ in $(seq 1 60); do
            latest=$(curl -fsS https://registry.npmjs.org/-/package/@withbuddi/buddi/dist-tags | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).latest||''))" 2>/dev/null || true)
            [ "$latest" = "$VERSION" ] && break
            sleep 15
          done
          if [ "$latest" != "$VERSION" ]; then echo "::warning::npm still says $latest, not $VERSION; the site rebuild would not show it yet. The hourly check will."; exit 0; fi
          curl -fsS -X POST "$HOOK" -o /dev/null && echo "withbuddi.com rebuild requested for $VERSION"
      - name: Chrome Web Store
        # The same zip the GitHub release carries goes to the store and is
        # submitted for review (scripts/release/cws-upload.mjs, the API calls
        # chrome-webstore-upload makes). The store takes one submission
        # at a time and reviews it in its own time, so a refused upload (a
        # version still in review, a version that does not increase) is a
        # notice, never a failed release: the zip stays on the GitHub release
        # for a manual upload. Three secrets, minted once per publisher account
        # with chrome-webstore-upload-keys: CWS_CLIENT_ID, CWS_CLIENT_SECRET,
        # CWS_REFRESH_TOKEN. The extension id is public.
        if: steps.v.outputs.tag == 'latest'
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          EXTENSION_ID: pbfpjefkiijjgefblpnlnlpmeaddfbah
          ZIP: ${{ steps.pack.outputs.zip }}
        # bash, not the implicit shell: that has no pipefail, and a refused
        # upload once reported success. No CLI output ever reaches the log:
        # scripts/release/cws-upload.mjs talks to the store API itself and
        # prints only the store's allowlisted explanation.
        shell: bash
        run: |
          set -euo pipefail
          for s in "$CLIENT_ID" "$CLIENT_SECRET" "$REFRESH_TOKEN"; do if [ -n "$s" ]; then echo "::add-mask::$s"; fi; done
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ] || [ -z "$REFRESH_TOKEN" ]; then
            echo "::notice title=Extension not sent to the Chrome Web Store::No CWS_CLIENT_ID / CWS_CLIENT_SECRET / CWS_REFRESH_TOKEN; upload $(basename "$ZIP") from the GitHub release by hand."
            exit 0
          fi
          if out=$(node scripts/release/cws-upload.mjs --source "$ZIP" --extension-id "$EXTENSION_ID" --publish); then
            printf '%s\n' "$out"
            echo "Chrome Web Store: $(basename "$ZIP") uploaded and submitted for review."
          else
            printf '%s\n' "$out"
            echo "::warning title=Chrome Web Store upload refused::$(printf '%s\n' "$out" | tail -n 3 | tr '\n' ' ') The zip is on the GitHub release; upload it by hand once the store is free."
          fi

  # The self-contained Linux install (docs/install.md): per architecture, the
  # tarball scripts/install.sh downloads, holding the Node buddi.app pins
  # (apps/mac/NODE_VERSION) with npm beside it, this version's npm tarball
  # (integrity and provenance checked, as the Mac app's payload is) and its
  # embedded Postgres. Each is built and smoke-installed on a runner of its own
  # architecture before it is attached to the GitHub release, with its .sha256.
  # Like mac-app it runs after the npm publish, and again on its own for a
  # version already on npm (Run workflow, publish off).
  linux:
    needs: [plan, publish]
    if: always() && (needs.plan.outputs.mode == 'mac' || needs.publish.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: write   # the release assets
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      ARCH: ${{ matrix.arch }}
      MODE: ${{ needs.plan.outputs.mode }}
    steps:
      # What is built and attached is the tag's install.sh and bundle script, never a branch's.
      - name: Run on the version's tag
        run: |
          [ "$GITHUB_REF" = "refs/tags/v$VERSION" ] || { echo "::error::Build the Linux tarballs from the tag v$VERSION (Run workflow on that tag), not $GITHUB_REF."; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # npm names a fresh version minutes before it serves the tarball.
      - name: Wait for npm to serve the tarball
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-pre\.[0-9]+)?$' || { echo "::error::\"$VERSION\" is not a buddi version"; exit 1; }
          url="https://registry.npmjs.org/@withbuddi/buddi/-/buddi-$VERSION.tgz"
          for i in $(seq 1 60); do
            if curl -sfI "$url" >/dev/null; then echo "served after $i check(s)"; exit 0; fi
            sleep 20
          done
          echo "::error::npm did not serve $url within 20 minutes; run this workflow again with version $VERSION"
          exit 1
      - name: Build the tarball (integrity and provenance checked)
        run: scripts/release/linux-bundle.sh "$VERSION" "$ARCH" build/linux
      # The installer on a clean account: the bundled node and npm, never the
      # runner's. GitHub's runners have no systemd user session, so buddi is
      # started without a service, checked, and removed again.
      - name: Install, start, check, uninstall
        run: |
          tgz="$PWD/build/linux/buddi-$VERSION-linux-$ARCH.tar.gz"
          BUDDI_TARBALL="$tgz" BUDDI_NO_START=1 sh scripts/install.sh
          buddi="$HOME/.local/bin/buddi"
          "$buddi" --no-service --no-open
          "$buddi" doctor > doctor.txt
          grep -q 'Runtime: Node v.*bundled with the Linux install' doctor.txt || { cat doctor.txt; echo "::error::buddi doctor does not report the bundled runtime"; exit 1; }
          grep -q '^npm: .* beside it' doctor.txt || { cat doctor.txt; echo "::error::no npm beside the bundled node"; exit 1; }
          "$buddi" uninstall --yes
          test ! -e "$HOME/.local/share/buddi" && test ! -e "$buddi" || { echo "::error::uninstall left the installation behind"; exit 1; }
          ls "$HOME/buddi-backups"
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$VERSION" >/dev/null || { echo "::error::v$VERSION has no GitHub release to attach to"; exit 1; }
          # install.sh is attached once, by the publish job; both legs here would race on it.
          gh release upload "v$VERSION" "build/linux/buddi-$VERSION-linux-$ARCH.tar.gz" "build/linux/buddi-$VERSION-linux-$ARCH.tar.gz.sha256" --clobber

  # The Windows setup (apps/windows, docs/install.md): the zip
  # scripts/release/windows-bundle.sh builds (the Node buddi.app pins, with npm
  # and the Visual C++ runtime beside it; this version's npm tarball, integrity
  # and provenance checked; its embedded Postgres), wrapped by Inno Setup
  # (pinned in scripts/release/windows-tools.sh) into
  # buddi-<version>-windows-x64-setup.exe: per user, no administrator. Both are
  # smoke-installed on the runner (install, doctor, uninstall) before they are
  # attached to the GitHub release with their .sha256. Unsigned for now
  # (SmartScreen warns); apps/windows/buddi.iss says how to sign. Same tag-only
  # guard and re-run path as the linux job.
  windows:
    needs: [plan, publish]
    if: always() && (needs.plan.outputs.mode == 'mac' || needs.publish.result == 'success')
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write   # the release assets
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Run on the version's tag
        run: |
          [ "$GITHUB_REF" = "refs/tags/v$VERSION" ] || { echo "::error::Build the Windows setup from the tag v$VERSION (Run workflow on that tag), not $GITHUB_REF."; exit 1; }
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-pre\.[0-9]+)?$' || { echo "::error::\"$VERSION\" is not a buddi version"; exit 1; }
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Wait for npm to serve the tarball
        run: |
          url="https://registry.npmjs.org/@withbuddi/buddi/-/buddi-$VERSION.tgz"
          for i in $(seq 1 60); do
            if curl -sfI "$url" >/dev/null; then echo "served after $i check(s)"; exit 0; fi
            sleep 20
          done
          echo "::error::npm did not serve $url within 20 minutes; run this workflow again with version $VERSION"
          exit 1
      - name: Inno Setup and the Visual C++ runtime
        run: scripts/release/windows-tools.sh
      - name: Build the zip (integrity and provenance checked) and the setup
        run: |
          scripts/release/windows-bundle.sh "$VERSION" build/windows
          scripts/release/windows-setup.sh "$VERSION" "build/windows/buddi-$VERSION-windows-x64.zip" build/windows
      - name: Install, start, check, uninstall
        run: scripts/release/windows-smoke.sh "build/windows/buddi-$VERSION-windows-x64-setup.exe"
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$VERSION" >/dev/null || { echo "::error::v$VERSION has no GitHub release to attach to"; exit 1; }
          gh release upload "v$VERSION" \
            "build/windows/buddi-$VERSION-windows-x64-setup.exe" "build/windows/buddi-$VERSION-windows-x64-setup.exe.sha256" \
            "build/windows/buddi-$VERSION-windows-x64.zip" "build/windows/buddi-$VERSION-windows-x64.zip.sha256" --clobber

  # The desktop app for Linux (apps/desktop, Tauri on WebKitGTK 4.1): a window
  # and a tray icon around the buddi the linux job's tarball installs. Per
  # architecture, a .deb (the system's WebKitGTK; ~2.6 MB; a prerelease is
  # versioned 0.1.0~pre.N so it sorts before 0.1.0) and an AppImage
  # (WebKitGTK and GStreamer inside, so the microphone works; ~90 MB), with
  # their .sha256, attached to the GitHub release. Built on Ubuntu 22.04, the
  # oldest base it supports (glibc 2.35, WebKitGTK 2.4x). Same tag-only guard
  # and the same re-run path as the linux job.
  desktop:
    needs: [plan, publish]
    if: always() && (needs.plan.outputs.mode == 'mac' || needs.publish.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-22.04, deb: amd64, appimage: amd64 }
          - { arch: arm64, runner: ubuntu-22.04-arm, deb: arm64, appimage: aarch64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write   # the release assets
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Run on the version's tag
        run: |
          [ "$GITHUB_REF" = "refs/tags/v$VERSION" ] || { echo "::error::Build the desktop app from the tag v$VERSION (Run workflow on that tag), not $GITHUB_REF."; exit 1; }
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-pre\.[0-9]+)?$' || { echo "::error::\"$VERSION\" is not a buddi version"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # WebKitGTK and the tray for the build; GStreamer's plugins (and patchelf)
      # for the AppImage, which carries them so getUserMedia finds PipeWire/Pulse.
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential file patchelf \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pulseaudio gstreamer1.0-pipewire
          # The toolchain apps/desktop/rust-toolchain.toml pins.
          (cd apps/desktop && rustup toolchain install && rustc --version)
      - name: Build the .deb and the AppImage
        working-directory: apps/desktop
        # The CLI pinned to the tauri crates in Cargo.lock.
        run: npx --yes @tauri-apps/cli@2.12.2 build --config "{\"version\":\"$VERSION\"}"
      - name: Check the .deb
        run: |
          deb=$(ls apps/desktop/target/release/bundle/deb/buddi-desktop_*_${{ matrix.deb }}.deb)
          # The paths it holds, without the leading "./" some builders write.
          files=$(dpkg-deb -c "$deb" | awk '{print $NF}' | sed 's#^\./##; s#^/##')
          echo "$files"
          dpkg-deb -f "$deb" Package | grep -qx 'buddi-desktop' || { echo "::error::the .deb is not the buddi-desktop package"; exit 1; }
          echo "$files" | grep -qx 'usr/bin/buddi-desktop' || { echo "::error::the .deb has no usr/bin/buddi-desktop"; exit 1; }
          # No autostart for every user: Start at Login is per account.
          if echo "$files" | grep -q '^etc/xdg/autostart/'; then echo "::error::the .deb starts the app for every user"; exit 1; fi
          echo "$files" | grep -qx 'usr/share/applications/buddi-desktop.desktop' || { echo "::error::the .deb has no app-grid entry"; exit 1; }
      - name: Name and checksum
        run: |
          mkdir -p build/desktop
          deb=$(ls apps/desktop/target/release/bundle/deb/buddi-desktop_*_${{ matrix.deb }}.deb)
          # A prerelease sorts before its release in dpkg only with a tilde: 0.1.0~pre.54 < 0.1.0.
          debver=$(printf '%s' "$VERSION" | sed 's/-/~/')
          if [ "$debver" != "$VERSION" ]; then
            work=$(mktemp -d)
            dpkg-deb -R "$deb" "$work"
            sed -i "s/^Version: .*/Version: $debver/" "$work/DEBIAN/control"
            dpkg-deb --root-owner-group -b "$work" "$deb"
            dpkg-deb -f "$deb" Version
          fi
          cp "$deb" "build/desktop/buddi-desktop-$VERSION-linux-$ARCH.deb"
          cp apps/desktop/target/release/bundle/appimage/buddi-desktop_*_${{ matrix.appimage }}.AppImage "build/desktop/buddi-desktop-$VERSION-linux-$ARCH.AppImage"
          cd build/desktop
          for f in *; do sha256sum "$f" > "$f.sha256"; done
          ls -l
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$VERSION" >/dev/null || { echo "::error::v$VERSION has no GitHub release to attach to"; exit 1; }
          gh release upload "v$VERSION" build/desktop/* --clobber

  # buddi.app, phase 2 of the Mac app (apps/mac/README.md). Skipped with a
  # notice, never failed, while the signing secrets are not in the repository:
  #
  #   MACOS_CERTIFICATE           base64 of the "Developer ID Application" .p12
  #   MACOS_CERTIFICATE_PASSWORD  its password
  #   APPLE_ID                    the Apple ID that submits to the notary service
  #   DEVELOPMENT_TEAM            the team id
  #   NOTARIZE_PASSWORD           an app-specific password for that Apple ID
  #   SPARKLE_PRIVATE_KEY         `generate_keys -x` output; signs the appcast item
  #
  # and, to publish the feed at withbuddi.com (buddi-site's worker serves the
  # bucket; the DMG itself stays a GitHub release asset, Wrangler caps R2
  # uploads at 300 MiB and the DMG is larger):
  #
  #   CLOUDFLARE_API_TOKEN        R2 object write on the bucket
  #   CLOUDFLARE_ACCOUNT_ID
  #   vars.R2_BUCKET              optional; `buddi-releases` by default
  #
  # Same secret names as Shotcrisp. Without the Cloudflare pair the DMG and
  # the feed are still attached to the GitHub release; appcast.xml and
  # latest.json point at the release asset either way.
  mac-check:
    needs: [plan, publish]
    if: always() && (needs.plan.outputs.mode == 'mac' || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - id: check
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          NOTARIZE_PASSWORD: ${{ secrets.NOTARIZE_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          PLANNED: ${{ needs.plan.outputs.version }}
        run: |
          v="$PLANNED"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-pre\.[0-9]+)?$' || { echo "::error::\"$v\" is not a buddi version like 0.1.0-pre.39"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          missing=""
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD APPLE_ID DEVELOPMENT_TEAM NOTARIZE_PASSWORD SPARKLE_PRIVATE_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::notice title=buddi.app not built::The repository has no$missing secret(s); the Mac app is skipped. See the mac-app job in release.yml."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

  mac-app:
    needs: [plan, publish, mac-check]
    if: always() && needs.mac-check.outputs.ok == 'true'
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: write   # the release assets
    env:
      VERSION: ${{ needs.mac-check.outputs.version }}
      PUBLISHED_TAG: ${{ needs.publish.outputs.dist_tag }}
      MODE: ${{ needs.plan.outputs.mode }}
      R2_BUCKET: ${{ vars.R2_BUCKET || 'buddi-releases' }}
    defaults:
      run:
        working-directory: apps/mac
    steps:
      # The DMG is built from the tag's app recipe, never a branch's (a Mac-only run included).
      - name: Run on the version's tag
        working-directory: .
        run: |
          [ "$GITHUB_REF" = "refs/tags/v$VERSION" ] || { echo "::error::Build buddi.app from the tag v$VERSION (Run workflow on that tag), not $GITHUB_REF."; exit 1; }
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: brew install xcodegen

      - name: Versions
        id: v
        run: |
          bundle=$(node ../../scripts/release/bundle-version.mjs "$VERSION")
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          # Only the version npm calls latest moves the download button and the
          # feed; a pre-release under `next` (once a stable exists) is attached
          # to its GitHub release and uploaded, and nothing points at it.
          # The publish run's first attempt takes the publish job's word: npm
          # answered the previous version right after pre.40 went out. A dispatch
          # (no publish) or a hand re-run asks npm, waiting up to 5 minutes for
          # the version to show under some dist-tag, so a re-run of an old
          # release never moves the feed back past a newer latest.
          if [ "$MODE" = "publish" ] && [ "$GITHUB_RUN_ATTEMPT" = "1" ] && [ -n "$PUBLISHED_TAG" ]; then
            latest_tag="$PUBLISHED_TAG"
            echo "published under $PUBLISHED_TAG (publish job)"
          else
            for i in $(seq 1 16); do
              tags=$(npm view @withbuddi/buddi dist-tags --json 2>/dev/null || true)
              if printf '%s' "$tags" | VERSION="$VERSION" node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.exit(Object.values(JSON.parse(s)).includes(process.env.VERSION)?0:1)}catch{process.exit(1)}})'; then break; fi
              [ "$i" = "16" ] || { echo "$VERSION not under any npm dist-tag yet ($i/16)"; sleep 20; }
            done
            latest=$(npm view @withbuddi/buddi dist-tags.latest 2>/dev/null || true)
            if [ "$latest" = "$VERSION" ]; then latest_tag=latest; else latest_tag=""; fi
            echo "npm latest is ${latest:-unknown}"
          fi
          if [ "$latest_tag" = "latest" ]; then echo "latest=true" >> "$GITHUB_OUTPUT"; else echo "latest=false" >> "$GITHUB_OUTPUT"; fi
          echo "buddi $VERSION, CFBundleVersion $bundle"

      # npm names a fresh version minutes before it serves the tarball.
      - name: Wait for npm to serve the tarball
        run: |
          url="https://registry.npmjs.org/@withbuddi/buddi/-/buddi-$VERSION.tgz"
          for i in $(seq 1 60); do
            if curl -sfI "$url" >/dev/null; then echo "served after $i check(s)"; exit 0; fi
            sleep 20
          done
          echo "::error::npm did not serve $url within 20 minutes; run this workflow again with version $VERSION"
          exit 1

      - name: Import the Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

      # fetch-payload.sh checks the tarball's sha512 against the registry AND its
      # provenance (signed by this repository's release.yml for tag v$VERSION, see
      # packages/install/src/provenance.ts); either failing fails the job before
      # anything is signed. Works the same on a workflow_dispatch re-run.
      - name: Node and the buddi release into Payload/ (integrity and provenance checked)
        run: make fetch VERSION="$VERSION"

      - name: Build, sign, notarize, staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          NOTARIZE_PASSWORD: ${{ secrets.NOTARIZE_PASSWORD }}
        run: |
          make notarize
          plist=build/Build/Products/Release/buddi.app/Contents/Info.plist
          test "$(plutil -extract CFBundleShortVersionString raw "$plist")" = "$VERSION"
          test "$(plutil -extract CFBundleVersion raw "$plist")" = "${{ steps.v.outputs.bundle }}"

      # The runtime the signed app carries answers, at the pinned version, with
      # npm beside it (plugin installs run that npm). npm's shebang is
      # `env node`, so the bundled runtime goes first on PATH.
      - name: The bundled Node and npm answer
        run: |
          rt=build/Build/Products/Release/buddi.app/Contents/Resources/runtime
          pinned="v$(tr -d '[:space:]' < NODE_VERSION)"
          node_v=$("$rt/node" --version) || { echo "::error::The bundled node does not run"; exit 1; }
          [ "$node_v" = "$pinned" ] || { echo "::error::The app bundles Node $node_v, NODE_VERSION pins $pinned"; exit 1; }
          [ "$(tr -d '[:space:]' < "$rt/VERSION")" = "$pinned" ] || { echo "::error::runtime/VERSION says $(cat "$rt/VERSION"), NODE_VERSION pins $pinned"; exit 1; }
          npm_v=$(PATH="$PWD/$rt:$PATH" "$rt/npm" --version) || { echo "::error::The app ships no working npm beside node"; exit 1; }
          echo "$npm_v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+' || { echo "::error::runtime/npm --version answered \"$npm_v\""; exit 1; }
          echo "buddi.app runtime: node $node_v, npm $npm_v"

      - name: Notarized DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          NOTARIZE_PASSWORD: ${{ secrets.NOTARIZE_PASSWORD }}
        run: make dmg && test -f "build/buddi-$VERSION.dmg"

      - name: Sign for Sparkle; appcast.xml and latest.json
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SIGN_UPDATE=$(find build/SourcePackages/artifacts -type f -name sign_update | head -1)
          test -x "$SIGN_UPDATE" || { echo "::error::sign_update not found under build/SourcePackages"; exit 1; }
          key="$RUNNER_TEMP/ed_private.key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key"
          signature=$("$SIGN_UPDATE" --ed-key-file "$key" "build/buddi-$VERSION.dmg")
          rm -f "$key"
          # A new appcast item only when the app shell changed (apps/mac/SHELL_VERSION,
          # bumped by hand): a buddi-only release is offered by the in-app updater.
          # The live feed decides it, so it must be read: a 200 is compared, a 404 is
          # the first feed ever; anything else (a timeout, a 5xx) fails the step
          # rather than republishing the Sparkle item for an unchanged shell.
          live="$RUNNER_TEMP/live-appcast.xml"
          code=$(curl -sSL --retry 3 --retry-all-errors --max-time 30 -o "$live" -w '%{http_code}' https://withbuddi.com/appcast.xml) || code=000
          case "$code" in
            200) previous=(--previous "$live") ;;
            404) previous=(--first-feed) ;;
            *) echo "::error::Could not read the live appcast (HTTP $code); not deciding the Sparkle item blind. Re-run the job."; exit 1 ;;
          esac
          node ../../scripts/release/appcast.mjs "$VERSION" "build/buddi-$VERSION.dmg" "$signature" build \
            --shell "$(cat SHELL_VERSION)" "${previous[@]}"

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          # The publish job creates the release; a run on its own may come first.
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --verify-tag --title "buddi $VERSION" \
            --notes "buddi $VERSION. npm: \`npm install -g @withbuddi/buddi@$VERSION\`."
          files=("build/buddi-$VERSION.dmg" build/latest.json)
          [ -f build/appcast.xml ] && files+=(build/appcast.xml)
          gh release upload "$tag" "${files[@]}" --clobber

      # Only the feed and the pointer go to R2; both point at the DMG on the
      # GitHub release attached above.
      - name: Publish the feed at withbuddi.com (R2)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LATEST: ${{ steps.v.outputs.latest }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=buddi.app not on withbuddi.com::No CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID; the feed is on the GitHub release only."
            exit 0
          fi
          put() { npx --yes wrangler@4 r2 object put "$R2_BUCKET/$1" --file "$2" --content-type "$3" --remote; }
          if [ "$LATEST" = "true" ]; then
            if [ -f build/appcast.xml ]; then put mac/appcast.xml build/appcast.xml application/xml
            else echo "::notice::The app shell did not change; the Sparkle feed stays as it is and buddi.app offers $VERSION itself."; fi
            put mac/latest.json build/latest.json application/json
          else
            echo "::notice::$VERSION is not npm's latest; withbuddi.com/download/mac and the feed stay where they are."
          fi
