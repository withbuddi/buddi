# A release: a tag `v<version>` builds the one tarball the trial and the
# packaged install use (`pnpm release:pack`) and publishes it to npmjs.com
# with provenance, through npm's trusted publishing (OIDC: no token lives in
# this repository). A pre-release version (`v0.1.0-pre.14`) goes under the
# `next` dist-tag, so `npm install @withbuddi/buddi` never resolves to it; a plain
# version (`v0.1.0`) goes under `latest`. The GitHub release is created in
# the same run, marked pre-release for a pre-release version, with the
# tarball and the Linux install script attached.
#
# Once, on npmjs.com: package `@withbuddi/buddi` → Settings → Publishing access →
# add a trusted publisher: GitHub, owner `withbuddi`, repository `buddi`,
# workflow `release.yml`, environment `npm`.
name: release
on:
  push:
    tags: ['v*']
jobs:
  # The full gate first: a tag publishes only what passed everything.
  gate:
    uses: ./.github/workflows/gate.yml
  publish:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: write   # the GitHub release
      id-token: write   # npm trusted publishing (provenance)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        # No `registry-url`: it writes an .npmrc with a token placeholder, and
        # npm then sends that instead of the OIDC token. Trusted publishing
        # needs npm 11.5 or later; Node 22 ships an older one.
        with: { node-version: 22, cache: pnpm }
      # npm 11: trusted publishing needs 11.5 or later, and 11 is what the
      # release build's `npm pack --json` was written against.
      - run: npm install -g npm@11 && npm --version
      - run: pnpm install --frozen-lockfile
      # The tarball is built from the workspace's dist output.
      - run: pnpm -r build
      - name: Version from the tag
        id: v
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          case "$v" in *-*) echo "tag=next" >> "$GITHUB_OUTPUT";; *) echo "tag=latest" >> "$GITHUB_OUTPUT";; esac
      - name: Build the tarball
        id: pack
        env:
          BUDDI_RELEASE_VERSION: ${{ steps.v.outputs.version }}
        run: |
          out=$(pnpm -s release:pack | tail -1)
          tgz="${out##*Release: }"
          test -f "$tgz" || { echo "release:pack printed no tarball: $out" >&2; exit 1; }
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"
      - name: Publish to npm
        # --provenance: npm attests the build to this public repository and
        # this workflow run, so an installer can verify where the tarball came from.
        run: npm publish "${{ steps.pack.outputs.tgz }}" --provenance --access public --tag "${{ steps.v.outputs.tag }}"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "${{ steps.v.outputs.version }}" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" $pre --title "buddi ${{ steps.v.outputs.version }}" \
            --notes "npm: \`npm install -g @withbuddi/buddi@${{ steps.v.outputs.version }}\` (dist-tag ${{ steps.v.outputs.tag }})." \
            "${{ steps.pack.outputs.tgz }}" scripts/install-linux.sh
