# The quick lane, on every push to main: boundaries, build, typecheck and
# every suite that needs no database (with no DATABASE_URL the database
# suites skip themselves). A few minutes. The full gate with Postgres is
# gate.yml: pull requests, tags, nightly, on demand.
name: ci
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'feedback/**']
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
