<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440">
  <title>Buddi Blob, core, neutral</title>
  <desc>Layered vector master: shadow, feet, arms, body with the signature bump, soft shading, face. Colours from the character bible.</desc>
  <defs>
    <radialGradient id="body" cx="38%" cy="30%" r="80%">
      <stop offset="0" stop-color="#6AAAFF"/>
      <stop offset="0.6" stop-color="#3F8EF7"/>
      <stop offset="1" stop-color="#2F78DC"/>
    </radialGradient>
    <linearGradient id="limb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A96F9"/>
      <stop offset="1" stop-color="#2F78DC"/>
    </linearGradient>
    <radialGradient id="sheen" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="belly" cx="50%" cy="100%" r="70%">
      <stop offset="0" stop-color="#152642" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#152642" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tip" cx="35%" cy="32%" r="70%">
      <stop offset="0" stop-color="#FF9B90"/>
      <stop offset="1" stop-color="#FF786A"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="body-clip">
      <path d="M200 96 C 240 90, 266 96, 284 88 C 300 80, 312 66, 330 56 C 348 48, 356 68, 344 86 C 336 100, 326 108, 326 122 C 348 158, 356 220, 352 270 C 348 330, 300 386, 206 388 C 108 390, 54 336, 52 268 C 50 190, 100 106, 200 96 Z"/>
    </clipPath>
  </defs>

  <g id="shadow">
    <ellipse cx="204" cy="410" rx="132" ry="14" fill="#152642" opacity="0.14" filter="url(#soft)"/>
  </g>
  <g id="feet">
    <ellipse cx="150" cy="394" rx="34" ry="15" fill="url(#limb)"/>
    <ellipse cx="258" cy="394" rx="34" ry="15" fill="url(#limb)"/>
  </g>
  <g id="arm-left">
    <path d="M68 262 C 36 254, 30 300, 62 306 C 84 310, 96 290, 86 274 Z" fill="url(#limb)"/>
  </g>
  <g id="body-main">
    <path d="M200 96 C 240 90, 266 96, 284 88 C 300 80, 312 66, 330 56 C 348 48, 356 68, 344 86 C 336 100, 326 108, 326 122 C 348 158, 356 220, 352 270 C 348 330, 300 386, 206 388 C 108 390, 54 336, 52 268 C 50 190, 100 106, 200 96 Z" fill="url(#body)"/>
    <g clip-path="url(#body-clip)">
      <ellipse cx="206" cy="380" rx="180" ry="72" fill="url(#belly)"/>
      <ellipse cx="140" cy="150" rx="76" ry="44" fill="url(#sheen)" transform="rotate(-16 140 150)"/>
      <ellipse cx="150" cy="248" rx="34" ry="10" fill="#152642" opacity="0.08" filter="url(#softer)"/>
      <ellipse cx="258" cy="244" rx="35" ry="10" fill="#152642" opacity="0.08" filter="url(#softer)"/>
    </g>
  </g>
  <g id="bump-tip">
    <ellipse cx="338" cy="80" rx="15" ry="6" fill="#152642" opacity="0.10" filter="url(#softer)"/>
    <path d="M326 52 C 331 38, 352 36, 361 48 C 369 58, 364 74, 350 78 C 336 82, 320 74, 322 62 C 322 58, 324 55, 326 52 Z" fill="url(#tip)"/>
    <ellipse cx="335" cy="51" rx="6" ry="4" fill="#FFFFFF" opacity="0.42" transform="rotate(-25 335 51)"/>
  </g>
  <g id="arm-right">
    <path d="M338 256 C 370 250, 376 292, 348 300 C 328 306, 316 286, 326 270 Z" fill="url(#limb)"/>
  </g>
  <g id="face">
    <g id="eye-left">
      <ellipse cx="150" cy="218" rx="33" ry="40" fill="#FFF7E8"/>
      <ellipse cx="150" cy="188" rx="28" ry="8" fill="#152642" opacity="0.06" filter="url(#softer)"/>
      <ellipse cx="157" cy="222" rx="19" ry="24" fill="#152642"/>
      <circle cx="165" cy="211" r="6.5" fill="#FFF7E8"/>
    </g>
    <g id="eye-right">
      <ellipse cx="258" cy="212" rx="34" ry="41" fill="#FFF7E8"/>
      <ellipse cx="258" cy="182" rx="29" ry="8" fill="#152642" opacity="0.06" filter="url(#softer)"/>
      <ellipse cx="265" cy="216" rx="19" ry="24" fill="#152642"/>
      <circle cx="273" cy="205" r="6.5" fill="#FFF7E8"/>
    </g>
    <g id="mouth">
      <path d="M186 282 C 196 294, 214 294, 224 282" fill="none" stroke="#152642" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>
</svg>
