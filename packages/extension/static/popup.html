<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=340" />
    <title>buddi</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <img class="blob" src="blob.png" alt="" width="28" height="28" />
      <span class="wordmark">buddi</span>
      <span class="pill" id="pill" data-tone="idle" role="status">Not connected</span>
    </header>

    <!-- Every buddi this browser knows, one row each: its name, its address, how it stands, and its switch. -->
    <ul class="buddis" id="buddis" aria-label="Your buddis"></ul>

    <!-- Add a buddi: the address of another buddi on this machine. -->
    <section class="add" id="add" hidden>
      <div class="field-group">
        <label class="label" for="gateway">Address of the buddi to add</label>
        <input class="field" id="gateway" type="url" value="http://127.0.0.1:4317" placeholder="http://127.0.0.1:4317" spellcheck="false" autocomplete="off" />
        <p class="hint" id="hint">A buddi running on this machine. Each buddi you add gets its own tab group.</p>
      </div>
      <p class="notice" id="notice" data-tone="critical" role="alert" hidden></p>
      <div class="actions">
        <button class="btn" data-variant="ghost" id="add-cancel" type="button">Cancel</button>
        <button class="btn" data-variant="accent" id="connect" type="button">Connect</button>
      </div>
    </section>

    <footer class="foot">
      <div class="facts" id="downloads-box" hidden>
        <p class="quiet" id="downloads-note">Let agents hand buddi the files they download in your Chrome, like a bank statement. Only downloads an agent's click starts are read; yours are never touched.</p>
      </div>
      <div class="actions">
        <button class="btn" data-size="sm" id="allow-downloads" type="button" hidden>Allow downloads</button>
        <button class="btn" data-size="sm" id="add-open" type="button">Add a buddi</button>
      </div>
    </footer>

    <!-- One buddi. Filled with textContent only: names and codes come from a socket. -->
    <template id="buddi-row">
      <li class="buddi" data-state="offline">
        <div class="buddi-head">
          <span class="swatch" aria-hidden="true"></span>
          <span class="buddi-who">
            <span class="buddi-name"></span>
            <span class="buddi-address"></span>
          </span>
          <span class="pill buddi-pill" data-tone="idle"></span>
          <label class="switch">
            <input class="buddi-switch" type="checkbox" role="switch" />
            <span class="switch-track" aria-hidden="true"></span>
          </label>
        </div>
        <div class="buddi-body">
          <div class="code-tile buddi-pairing" hidden>
            <p class="code" aria-label="Pairing code"></p>
            <button class="btn buddi-copy" data-size="sm" type="button">Copy</button>
          </div>
          <p class="hint buddi-pairing-hint" hidden>Type it into this buddi under Settings → Browser&nbsp;&amp;&nbsp;apps, within five minutes. Open buddi settings may open buddi.app: if Chrome asks, allow it.</p>
          <p class="quiet buddi-asking" hidden>Asking this buddi for a code…</p>
          <p class="quiet buddi-working" hidden></p>
          <p class="notice buddi-error" data-tone="critical" role="alert" hidden></p>
          <div class="actions">
            <button class="link buddi-remove" type="button">Remove</button>
            <span class="actions-gap"></span>
            <button class="btn buddi-retry" data-size="sm" type="button" hidden>Try again</button>
            <button class="btn buddi-settings" data-size="sm" type="button" hidden>Open buddi settings</button>
            <button class="btn buddi-open" data-size="sm" type="button" hidden>Open buddi</button>
          </div>
        </div>
      </li>
    </template>

    <script src="popup.js" type="module"></script>
  </body>
</html>
