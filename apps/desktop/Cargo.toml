[package]
name = "buddi-desktop"
version = "0.1.0"
description = "buddi's desktop app: a window and a tray icon around the buddi installed on this computer"
edition = "2021"
license = "Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
open = "5"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_40"] }
notify-rust = "4"

[features]
# Right-click → Inspect in the window; only for local builds (cargo tauri dev, or --features devtools).
devtools = ["tauri/devtools"]

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
