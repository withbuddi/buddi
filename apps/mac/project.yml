name: buddi
options:
  bundleIdPrefix: com.withbuddi
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
    # The payload step below copies into the bundle with rsync.
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

targets:
  buddi:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "*.entitlements"
      - path: MenuBar
      - path: Resources
    dependencies:
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Apache-2.0"
        # The app is versioned as the buddi release it carries (Payload/buddi/current).
        # The Makefile passes both: the buddi version as it is for display, and
        # scripts/release/bundle-version.mjs's numbers-and-dots form for Sparkle,
        # which compares CFBundleVersion (0.1.0-pre.39 → 0.1.0.39, 0.1.0 → 0.1.0.1000).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SUFeedURL: "https://withbuddi.com/appcast.xml"
        # Placeholder: generate the key pair once with Sparkle's tool —
        #   build/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_keys
        # (it stores the private key in the login keychain and prints the public
        # one). Paste the public key here; export the private key with
        # `generate_keys -x sparkle_private.key` into the SPARKLE_PRIVATE_KEY secret.
        # Sparkle EdDSA public key for buddi (keychain account "buddi" on Amen's Mac); the private half is the SPARKLE_PRIVATE_KEY secret.
        SUPublicEDKey: "jBAeEEwStNtRScUv07ddeqG+Bn4OanHAwd4gkPLD6/Q="
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.withbuddi.app
        PRODUCT_NAME: buddi
        # Placeholders for a build without a payload; the Makefile overrides both.
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "0.0.0.0"
        CODE_SIGN_ENTITLEMENTS: App/buddi.entitlements
        CODE_SIGN_STYLE: Manual
        # DEVELOPMENT_TEAM is not written here: the Makefile passes it from the
        # environment (as CI does from secrets.DEVELOPMENT_TEAM).
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Debug signs to run locally (ad-hoc) unless the Makefile passes the
        # Developer ID identity because DEVELOPMENT_TEAM is set.
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
    scheme:
      testTargets: [buddiTests]
    # The Node runtime and the buddi release (fetched into Payload/ by `make fetch`)
    # go into Contents/Resources as they are: rsync keeps the `current` link and
    # the Postgres dylib links. Runs before Xcode signs the bundle.
    postBuildScripts:
      - name: Embed runtime and buddi release
        script: |
          if [ ! -x "$SRCROOT/Payload/runtime/node" ] || [ ! -e "$SRCROOT/Payload/buddi/current" ]; then
            echo "warning: Payload/ is empty; run 'make fetch' first. The app will report itself incomplete."
            exit 0
          fi
          mkdir -p "$CODESIGNING_FOLDER_PATH/Contents/Resources"
          rsync -a --delete "$SRCROOT/Payload/runtime/" "$CODESIGNING_FOLDER_PATH/Contents/Resources/runtime/"
          rsync -a --delete "$SRCROOT/Payload/buddi/" "$CODESIGNING_FOLDER_PATH/Contents/Resources/buddi/"
        basedOnDependencyAnalysis: false

  # Logic tests, without a host app: launching buddi.app would start a supervisor on
  # the real data directory. Only the Foundation-only decision code is compiled in.
  buddiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: App/SupervisorPolicy.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.withbuddi.app.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
